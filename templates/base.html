<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WZ Alpha 门户{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'portal:index' %}">WZ Alpha</a>
        {% if user.is_authenticated %}
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">你好，{{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'portal:logout' %}">退出</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
