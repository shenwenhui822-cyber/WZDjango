<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WZ Alpha{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .site-navbar {
            background-color: #1a1f2e;
            min-height: 60px;
        }
        .site-navbar .navbar-brand {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .site-navbar .navbar-brand:hover { color: #fff; }
        .top-nav-link {
            color: #ccc !important;
            padding: 0.55rem 0.95rem !important;
            border-radius: 0;
            white-space: nowrap;
            font-weight: 500;
            line-height: 1.1;
            text-decoration: none;
        }
        .top-nav-link:hover {
            color: #ffffff !important;
            background-color: #2c3241;
        }
        .top-nav-link.active {
            color: #ffffff !important;
            background-color: #2c3241;
            font-weight: 600;
        }
        .top-nav-scroll { overflow-x: auto; overflow-y: hidden; }
        .site-navbar .navbar-text { color: #d7dce4 !important; }
        .site-navbar .btn-outline-light {
            border-color: #7f8798;
            color: #e5e9f1;
        }
        .site-navbar .btn-outline-light:hover {
            border-color: #a8b0bf;
            background-color: #2c3241;
            color: #fff;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg site-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'portal:index' %}">WZ Alpha</a>
        {% if user.is_authenticated %}
        <div class="top-nav-scroll ms-3 me-auto">
            <ul class="navbar-nav flex-row align-items-center gap-1">
                <li class="nav-item">
                    <a href="{% url 'portal:nav_curve' %}" class="nav-link top-nav-link {% if request.resolver_match.url_name == 'nav_curve' %}active{% endif %}">净值曲线</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'portal:nav_bench_compare' %}" class="nav-link top-nav-link {% if request.resolver_match.url_name == 'nav_bench_compare' %}active{% endif %}">净值基准对比</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'portal:alpha_daily' %}" class="nav-link top-nav-link {% if request.resolver_match.url_name == 'alpha_daily' %}active{% endif %}">Alpha 产品日报</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'portal:raw_nav' %}" class="nav-link top-nav-link {% if request.resolver_match.url_name == 'raw_nav' %}active{% endif %}">基金净值</a>
                </li>
            </ul>
        </div>
        {% endif %}
        {% if user.is_authenticated %}
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">你好，{{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'portal:logout' %}">退出</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
